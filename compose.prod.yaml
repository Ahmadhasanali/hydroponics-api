services:
    hydroponic-api:
        build:
            context: .
            dockerfile: docker/Dockerfile.prod
            args:
                WWWGROUP: "${WWWGROUP:-1000}"
                WWWUSER: "${WWWUSER:-1000}"
        image: hydroponic-api:latest
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - /home/deploy/.secrets/firebase/service-account.json:/home/deploy/.secrets/firebase/service-account.json:ro
        expose:
            - "80"
        networks:
            - pgsql_default
            - traefik-public
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.hydroponic-api.rule=Host(`hydroponic-api.ahmadhasan.my.id`)"
            - "traefik.http.routers.hydroponic-api.entrypoints=web"
            - "traefik.http.routers.hydroponic-api.middlewares=rate-limit@file"
            - "traefik.http.services.hydroponic-api.loadbalancer.server.port=80"
            - "traefik.docker.network=traefik-public"

networks:
    pgsql_default:
        external: true
    traefik-public:
        external: true
